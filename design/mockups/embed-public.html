<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Embed — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>(function(){var t=localStorage.getItem('umetrica-mockup-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})();</script>
  </head>
  <body>
    <div class="embed-public">
      <header class="embed-public__bar">
        <div class="embed-public__brand"><span class="brand__mark" style="width:22px;height:22px;font-size:12px">A</span> Acme Analytics · Операционный обзор</div>
        <a href="https://umetrica.ru" class="text-xs text-muted" style="text-decoration:none">Powered by umetrica</a>
      </header>
      <main class="embed-public__body">
        <div class="embed-public__frame">
          <div class="stat-strip" style="margin-bottom:16px">
            <div class="stat-strip__item"><p class="stat-strip__label">Выручка (7д)</p><p class="stat-strip__value">1,24 млн ₽</p></div>
            <div class="stat-strip__item"><p class="stat-strip__label">Заказы</p><p class="stat-strip__value">318</p></div>
            <div class="stat-strip__item"><p class="stat-strip__label">Обновлено</p><p class="stat-strip__value text-sm" style="font-size:14px;font-weight:600">14 июн</p></div>
          </div>
          <div style="height:200px;border:1px dashed var(--border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);font-size:13px">График выручки по дням · read-only</div>
        </div>
        <p class="text-xs text-muted" style="margin-top:12px;text-align:center"><a href="dashboard-share.html">← Настройки embed</a> · <a href="dashboard-detail.html">Полный дашборд</a></p>
      </main>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
