<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI-инсайты — пусто — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = localStorage.getItem('umetrica-mockup-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/insights · empty</span></div>
      <div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div>
    </div>

    <div class="app-frame">
      <div data-app-sidebar="insights"></div>
      <div class="app-main">
        <header class="mobile-header">
          <div><div class="mobile-header__title">AI-инсайты</div></div>
          <button class="btn btn--sm" type="button" disabled><iconify-icon icon="lucide:refresh-cw"></iconify-icon> Проверить</button>
        </header>
        <main class="app-scroll">
          <article class="doc">
            <div class="doc-head">
              <div class="doc-head__row">
                <span class="doc-head__icon"><iconify-icon icon="lucide:sparkles"></iconify-icon></span>
                <h1 class="doc-title">AI-инсайты</h1>
              </div>
              <p class="doc-lead">Проактивные оценки по вашим метрикам</p>
            </div>
            <div class="doc-props">
              <span class="doc-prop"><span class="doc-prop__label">AI-кредиты</span> 100 / 100</span>
              <span class="doc-prop"><span class="doc-prop__label">Проверок</span> 0</span>
            </div>

            <section class="doc-block">
              <div class="empty-state">
                <span class="empty-state__icon"><iconify-icon icon="lucide:sparkles"></iconify-icon></span>
                <h2 class="empty-state__title">Инсайтов пока нет</h2>
                <p class="empty-state__desc">Нужны опубликованные кубы и данные за последние 30 дней. Запустите первую проверку аномалий — это займёт 1 AI-кредит.</p>
                <div class="empty-state__actions">
                  <a class="btn" href="semantic-list.html">Настроить семантику</a>
                  <button class="btn btn--outline" type="button">Проверить аномалии</button>
                </div>
              </div>
            </section>
          </article>
        </main>
        <div data-app-tabbar="insights"></div>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
