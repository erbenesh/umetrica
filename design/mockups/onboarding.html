<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Онбординг — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = localStorage.getItem('umetrica-mockup-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/onboarding</span></div>
      <div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div>
    </div>
    <div class="auth-frame">
      <aside class="auth-brand-panel"><div><h2>Создайте магазин</h2><p>Укажите название и категорию — рыночные инсайты появятся сразу, кабинет подключите позже.</p></div></aside>
      <div class="auth-form-panel">
        <header class="auth-topbar"><span class="brand__mark">u</span><button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Тема"></button></header>
        <main class="auth-main">
          <div class="auth-panel">
            <div class="auth-panel__head"><h1>Название магазина</h1><p>Рабочее пространство для дашбордов, рынка и команды</p></div>
            <div class="auth-panel__card">
              <div class="form-fields">
                <div class="field"><label for="c">Магазин / компания</label><input class="input" id="c" type="text" placeholder="HomeStyle" value="HomeStyle" /></div>
                <div class="field"><label for="cat">Категория на WB</label><select class="input" id="cat"><option selected>Дом и текстиль</option><option>Одежда</option></select></div>
              </div>
              <div class="form-actions">
                <a class="btn btn--block" href="onboarding-connect.html">Создать компанию</a>
              </div>
            </div>
            <div class="auth-panel__footer">Есть приглашение? <a href="accept-invitation.html">Откройте ссылку</a> или <a href="team.html">Команда</a></div>
          </div>
        </main>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
