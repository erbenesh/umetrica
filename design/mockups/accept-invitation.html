<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Приглашение — Sellerpool mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = (localStorage.getItem('sellerpool-mockup-theme') || localStorage.getItem('umetrica-mockup-theme'));
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/accept-invitation</span></div>
      <div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div>
    </div>
    <div class="auth-frame">
      <aside class="auth-brand-panel">
        <div>
          <h2>Вас ждут в Acme Analytics</h2>
          <p>Роль: Наблюдатель. Без отдельной компании — сразу в команду пригласившего.</p>
        </div>
      </aside>
      <div class="auth-form-panel">
        <header class="auth-topbar"><span class="brand__mark">s</span><button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Тема"></button></header>
        <main class="auth-main">
          <div class="auth-panel">
            <div class="auth-panel__head">
              <h1>Присоединиться</h1>
              <p>Email из приглашения: anna@partner.ru</p>
            </div>
            <div class="auth-panel__card">
              <div class="form-fields">
                <div class="field"><label for="name">Имя</label><input class="input" id="name" type="text" placeholder="Анна" /></div>
                <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" readonly value="anna@partner.ru" /></div>
                <div class="field"><label for="password">Пароль</label><input class="input" id="password" type="password" /></div>
              </div>
              <div class="form-actions">
                <button class="btn btn--block" type="button">Зарегистрироваться и войти</button>
              </div>
            </div>
            <div class="auth-panel__footer"><a href="#">Уже есть аккаунт? Войти</a></div>
          </div>
        </main>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
