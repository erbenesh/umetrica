<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Профиль — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = localStorage.getItem('umetrica-mockup-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/settings/profile</span></div>
      <div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div>
    </div>
    <div class="app-frame">
      <div data-app-sidebar="settings"></div>
      <div class="app-main">
        <header class="mobile-header">
          <div><a href="settings.html" class="text-xs text-muted">← Настройки</a><div class="mobile-header__title">Профиль</div></div>
        </header>
        <main class="app-scroll">
          <article class="doc">
            <div class="doc-head">
              <div class="doc-head__row"><span class="doc-head__icon"><iconify-icon icon="lucide:user"></iconify-icon></span><h1 class="doc-title">Профиль</h1></div>
              <p class="doc-lead">Имя, email и аватар — видны команде в Acme Analytics</p>
            </div>
            <section class="doc-block">
              <h2 class="doc-h2">Аватар</h2>
              <div class="media-upload">
                <div class="media-upload__preview media-upload__preview--avatar" aria-hidden="true">Е</div>
                <div class="media-upload__meta">
                  <div class="media-upload__actions">
                    <button class="btn btn--sm" type="button"><iconify-icon icon="lucide:upload"></iconify-icon> Загрузить</button>
                    <button class="btn btn--ghost btn--sm" type="button">Удалить</button>
                  </div>
                  <p class="media-upload__hint">JPG или PNG, до 2 МБ. Рекомендуем 256×256 px.</p>
                </div>
              </div>
            </section>
            <section class="doc-block">
              <h2 class="doc-h2">Данные</h2>
              <form class="form-fields">
                <div class="form-grid form-grid--2">
                  <div class="field"><label for="name">Имя</label><input class="input" id="name" type="text" value="Егор" /></div>
                  <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" value="founder@acme.ru" /></div>
                </div>
                <div class="field">
                  <label>Роль в компании</label>
                  <input class="input" type="text" value="Владелец" readonly />
                  <p class="field__hint">Меняется через передачу владения · <a href="team.html">Команда</a></p>
                </div>
              </form>
            </section>
            <section class="doc-block">
              <div class="form-actions" style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn" type="button">Сохранить</button>
                <a class="btn btn--ghost" href="settings.html">Отмена</a>
              </div>
            </section>
          </article>
        </main>
        <div data-app-tabbar="settings"></div>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
