<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Сброс пароля — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = localStorage.getItem('umetrica-mockup-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/forgot-password</span></div>
      <div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div>
    </div>
    <div class="auth-frame">
      <aside class="auth-brand-panel"><div><h2>Восстановление доступа</h2><p>Отправим безопасную ссылку на ваш email.</p></div></aside>
      <div class="auth-form-panel">
        <header class="auth-topbar"><a href="auth-login.html" class="brand"><span class="brand__mark">u</span></a><button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Тема"></button></header>
        <main class="auth-main">
          <div class="auth-panel">
            <div class="auth-panel__head"><h1>Сброс пароля</h1><p>Введите email аккаунта</p></div>
            <div class="auth-panel__card">
              <div class="form-fields">
                <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" value="founder@acme.ru" /></div>
              </div>
              <div class="form-actions">
                <button class="btn btn--block" type="button">Отправить ссылку</button>
              </div>
            </div>
            <div class="auth-panel__footer"><a href="auth-login.html">Вернуться ко входу</a></div>
          </div>
        </main>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
