<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Новый пароль — Sellerpool mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = (localStorage.getItem('sellerpool-mockup-theme') || localStorage.getItem('umetrica-mockup-theme'));
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/reset-password</span></div>
      <div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div>
    </div>
    <div class="auth-frame">
      <aside class="auth-brand-panel"><div><h2>Новый пароль</h2><p>Минимум 8 символов, используйте уникальный пароль.</p></div></aside>
      <div class="auth-form-panel">
        <header class="auth-topbar"><a href="auth-login.html" class="brand"><span class="brand__mark">s</span></a><button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Тема"></button></header>
        <main class="auth-main">
          <div class="auth-panel">
            <div class="auth-panel__head"><h1>Задайте пароль</h1><p>После сохранения войдите с новым паролем</p></div>
            <div class="auth-panel__card">
              <div class="form-fields">
                <div class="field"><label for="p1">Новый пароль</label><input class="input" id="p1" type="password" /></div>
                <div class="field"><label for="p2">Повторите</label><input class="input" id="p2" type="password" /></div>
              </div>
              <div class="form-actions">
                <button class="btn btn--block" type="button">Сохранить пароль</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
