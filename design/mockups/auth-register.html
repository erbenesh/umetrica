<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Регистрация — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>
      (function () {
        var t = localStorage.getItem('umetrica-mockup-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar">
      <div class="mockup-bar__left">
        <a href="index.html" class="mockup-bar__title">← Макеты</a>
        <span class="mockup-bar__meta">/auth · регистрация</span>
      </div>
      <div class="mockup-bar__actions">
        <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button>
      </div>
    </div>

    <div class="auth-frame">
      <aside class="auth-brand-panel">
        <div>
          <div class="brand" style="margin-bottom: 32px">
            <span class="brand__mark">u</span>
            <span><div class="brand__name">umetrica</div></span>
          </div>
          <h2>Аналитика маркетплейсов с рыночным контекстом</h2>
          <p>Создайте компанию — сначала рыночные инсайты по категории, потом подключите кабинет CSV или API.</p>
        </div>
        <div class="auth-brand-panel__stats">
          <div class="auth-stat"><strong>WB</strong><span>Ozon · Маркет</span></div>
          <div class="auth-stat"><strong>152-ФЗ</strong><span>данные в РФ</span></div>
        </div>
      </aside>

      <div class="auth-form-panel">
        <header class="auth-topbar">
          <a href="auth-login.html" class="brand"><span class="brand__mark">u</span><span><div class="brand__name">umetrica</div></span></a>
          <button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Тема"></button>
        </header>
        <main class="auth-main">
          <div class="auth-panel">
            <div class="auth-panel__head">
              <h1>Создать аккаунт</h1>
              <p>Для основателя компании</p>
            </div>
            <div class="auth-panel__card">
              <div class="form-fields">
                <div class="field"><label for="name">Имя</label><input class="input" id="name" type="text" value="Егор" /></div>
                <div class="field"><label for="company">Магазин / компания</label><input class="input" id="company" type="text" value="HomeStyle" placeholder="Как на маркетплейсе" /></div>
                <div class="field"><label for="category">Категория (для рыночных инсайтов)</label><select class="input" id="category"><option selected>Дом и текстиль</option><option>Одежда</option><option>Красота и здоровье</option><option>Другое</option></select></div>
                <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" value="founder@acme.ru" /></div>
                <div class="field"><label for="password">Пароль</label><input class="input" id="password" type="password" value="password" /></div>
              </div>
              <div class="form-actions">
                <button class="btn btn--block" type="button">Зарегистрироваться</button>
              </div>
            </div>
            <div class="auth-panel__footer"><span>Уже есть аккаунт? <a href="auth-login.html">Войти</a></span></div>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/mockup.js"></script>
  </body>
</html>
