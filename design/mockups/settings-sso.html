<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SSO — umetrica mockup</title>
    <link rel="stylesheet" href="assets/mockup.css" />
    <script>(function(){var t=localStorage.getItem('umetrica-mockup-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})();</script>
  </head>
  <body class="has-mockup-bar">
    <div class="mockup-bar"><div class="mockup-bar__left"><a href="index.html" class="mockup-bar__title">← Макеты</a><span class="mockup-bar__meta">/settings/sso</span></div><div class="mockup-bar__actions"><button class="btn btn--ghost btn--sm" type="button" data-theme-toggle><span data-theme-label>Тёмная</span></button></div></div>
    <div class="app-frame">
      <div data-app-sidebar="settings"></div>
      <div class="app-main">
        <header class="mobile-header"><div><a href="settings-company.html" class="text-xs text-muted">← Компания</a><div class="mobile-header__title">SSO</div></div></header>
        <main class="app-scroll">
          <article class="doc">
            <div class="doc-head"><div class="doc-head__row"><span class="doc-head__icon"><iconify-icon icon="lucide:key-round"></iconify-icon></span><h1 class="doc-title">SSO / SAML</h1></div><p class="doc-lead">Enterprise · вход через корпоративный IdP</p></div>
            <section class="doc-block">
              <label class="checkbox-row"><input type="checkbox" checked /><span>Требовать SSO для всех участников</span></label>
            </section>
            <section class="doc-block">
              <h2 class="doc-h2">SAML 2.0</h2>
              <form class="form-fields">
                <div class="field"><label for="idp-url">IdP SSO URL</label><input class="input" id="idp-url" type="url" placeholder="https://idp.company.com/saml/sso" /></div>
                <div class="field"><label for="entity">Entity ID</label><input class="input" id="entity" type="text" value="umetrica-acme-analytics" readonly /></div>
                <div class="field"><label for="cert">Сертификат IdP (PEM)</label><textarea class="input textarea textarea--sm" id="cert" rows="4" placeholder="-----BEGIN CERTIFICATE-----"></textarea></div>
              </form>
            </section>
            <section class="doc-block">
              <div class="callout callout--compact"><span>После включения парольный вход отключается для участников компании. Владелец сохраняет резервный доступ.</span></div>
              <div class="form-actions" style="display:flex;gap:8px;margin-top:12px"><button class="btn" type="button">Сохранить</button><button class="btn btn--ghost" type="button">Тестовый вход</button></div>
            </section>
          </article>
        </main>
        <div data-app-tabbar="settings"></div>
      </div>
    </div>
    <script src="assets/mockup.js"></script>
  </body>
</html>
