cubes:
  - name: Orders
    sql: SELECT * FROM public.orders

    measures:
      - name: count
        type: count

      - name: revenue
        sql: amount
        type: sum
        format: currency

      - name: avgOrder
        sql: amount
        type: avg
        format: currency

    dimensions:
      - name: tenantId
        sql: tenant_id
        type: string

      - name: status
        sql: status
        type: string

      - name: createdAt
        sql: created_at
        type: time
