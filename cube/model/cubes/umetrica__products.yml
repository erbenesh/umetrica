cubes:
  - name: Products
    title: "Товары"
    sql: "SELECT * FROM public.products"
    measures:
      - name: count
        title: "Количество SKU"
        type: count
      - name: totalPrice
        title: "Сумма цен"
        sql: price
        type: sum
        format: currency
      - name: avgPrice
        title: "Средняя цена"
        sql: price
        type: avg
        format: currency
    dimensions:
      - name: name
        title: "Название"
        sql: name
        type: string
      - name: category
        title: "Категория"
        sql: category
        type: string
      - name: createdAt
        title: "Дата добавления"
        sql: created_at
        type: time
        granularity: day
      - name: tenantId
        title: tenantId
        sql: tenant_id
        type: string
    pre_aggregations:
      - name: by_category
        measures:
          - count
          - totalPrice
        dimensions:
          - category
