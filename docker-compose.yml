services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: umetrica
      POSTGRES_PASSWORD: umetrica
      POSTGRES_DB: umetrica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umetrica"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cube:
    image: cubejs/cube:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-umetrica-cube-secret-change-me}
      CUBEJS_CORS_ORIGIN: http://localhost:5173
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: umetrica
      CUBEJS_DB_USER: umetrica
      CUBEJS_DB_PASS: umetrica
    volumes:
      - ./cube:/cube/conf
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
